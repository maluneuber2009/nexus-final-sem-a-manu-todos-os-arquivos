<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demo do personagem</title>
<style>
  html, body { margin: 0; height: 100%; background: #14101a; color: #e9dfe6; font-family: system-ui, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
  canvas { max-width: 96vw; background: #2a1f33; image-rendering: pixelated; border-radius: 6px; }
  p { margin: 0; font-size: 14px; opacity: .8; }
</style>
</head>
<body>
<canvas id="game" width="960" height="540"></canvas>
<p>Setas ou A/D: andar · Shift: correr · Espaço: pular</p>

<script src="player.js"></script>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const GROUND = 460;

const player = new Player({ x: 200, y: GROUND, scale: 0.7 });
const input = new KeyboardInput();
let last = performance.now();

function loop(now) {
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;
  player.update(dt, input, GROUND);
  player.x = Math.max(30, Math.min(canvas.width - 30, player.x));

  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#3a2a45';
  ctx.fillRect(0, GROUND, canvas.width, canvas.height - GROUND);
  ctx.fillStyle = '#6b3b57';
  ctx.fillRect(0, GROUND, canvas.width, 4);

  player.draw(ctx);
  requestAnimationFrame(loop);
}

player.load('personagem_spritesheet.png').then(() => requestAnimationFrame(loop));
</script>
</body>
</html>
